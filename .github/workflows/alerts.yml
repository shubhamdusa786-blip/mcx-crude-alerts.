name: MCX Crude Oil Indian Price Alert

on:
  workflow_dispatch:

  schedule:
    # Monday–Friday
    # 09:00 AM–11:30 PM India time
    # GitHub cron works only in UTC
    - cron: "*/15 4-17 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "0,15,30 18 * * 1-5"
name: MCX Crude Oil Indian Price Alert

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions uses UTC, not IST.
    # Runs every 15 min:
    # 09:00 AM, 09:15 AM ... 11:30 PM IST
    # Monday to Friday.
    - cron: "0,15,30,45 4-17 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "0,15,30 18 * * 1-5"

jobs:
  mcx-crude-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MCX alert checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
        on:
  workflow_dispatch:

  schedule:
    # 09:00 AM IST
    - cron: "30 3 * * 1-5"

    # 09:15 AM to 10:45 PM IST, every 15 minutes
    - cron: "*/15 4-17 * * 1-5"

    # 11:00 PM, 11:15 PM and 11:30 PM IST
    - cron: "0,15,30 18 * * 1-5"
    on:
  workflow_dispatch:

  schedule:
    # 09:00 AM IST
    - cron: "30 3 * * 1-5"

    # 09:15 AM IST to 10:45 PM IST — every 15 minutes
    - cron: "*/15 4-17 * * 1-5"

    # 11:00 PM, 11:15 PM, 11:30 PM IST
    - cron: "0,15,30 18 * * 1-5"
    name: MCX Crude Oil INR Alert

on:
  workflow_dispatch:

  schedule:
    # Every 15 min from 09:00 AM IST to 10:45 PM IST
    - cron: "*/15 4-16 * * 1-5"
    - cron: "30,45 3 * * 1-5"
    - cron: "0,15,30,45 17 * * 1-5"

    # 11:00 PM, 11:15 PM and 11:30 PM IST
    - cron: "30,45 17 * * 1-5"
    - cron: "0 18 * * 1-5"

jobs:
  mcx-crude-alert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Check MCX Crude Oil INR price and alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
    
